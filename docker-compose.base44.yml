services:
  excalidraw-app:
    image: node:24-bookworm
    working_dir: /app
    labels:
      base44.project: Excalidraw
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:3000"
    environment:
      # vite's dev server binds 0.0.0.0 and must not try to open a browser
      - BROWSER=none
      # watch through the bind mount (inotify events are not forwarded)
      - CHOKIDAR_USEPOLLING=true
    command:
      - sh
      - -ec
      - |
        yarn install --frozen-lockfile --network-timeout 600000
        cd excalidraw-app
        exec ../node_modules/.bin/vite --host 0.0.0.0 --port 3000 --strictPort
    volumes:
      - ./:/app
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: on-failure
