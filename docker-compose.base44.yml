services:
  web:
    image: node:22
    working_dir: /app
    labels:
      base44.project: "Excalidraw"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      # bind mounts on the sandbox do not always deliver inotify events
      - CHOKIDAR_USEPOLLING=true
      - BROWSER=none
    volumes:
      - ./:/app
    # dependencies live in the bind-mounted node_modules, so install from the
    # current lockfile on startup, then run the Vite dev server (live reload).
    command:
      [
        "sh",
        "-ec",
        "yarn install --frozen-lockfile --network-timeout 600000 && exec yarn --cwd excalidraw-app vite --host 0.0.0.0 --port 3000",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:3000/ | grep -q 'id=\"root\"' || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    restart: on-failure
