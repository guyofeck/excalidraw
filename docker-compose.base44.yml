services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    labels:
      base44.project: "Excalidraw"
      base44.kind: "web"
      base44.port: "3000"
    working_dir: /app
    # Dev server from the bind-mounted source; deps live in a named volume and
    # are synced from yarn.lock on every start.
    command:
      [
        "sh",
        "-ec",
        "yarn install --frozen-lockfile --non-interactive --network-timeout 600000 && exec yarn --cwd excalidraw-app vite --host 0.0.0.0 --port 3000 --strictPort",
      ]
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - CI=true
      # vite.config sets server.open: true; there is no browser in the container
      - BROWSER=none
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s

volumes:
  node_modules:
