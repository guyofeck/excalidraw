services:
  web:
    image: node:22
    working_dir: /opt/node_app/app
    command:
      - sh
      - -ec
      - |
        mkdir -p /tmp/bin
        printf '#!/bin/sh\nexit 0\n' > /tmp/bin/xdg-open
        chmod +x /tmp/bin/xdg-open
        yarn install --frozen-lockfile --network-timeout 600000
        PATH="/tmp/bin:$PATH" exec yarn --cwd excalidraw-app vite --host 0.0.0.0 --port 3000 --strictPort
    ports:
      - "3000:3000"
    volumes:
      - ./:/opt/node_app/app
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    labels:
      base44.project: "Excalidraw"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: on-failure
