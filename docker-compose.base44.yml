services:
  web:
    image: node:22
    working_dir: /opt/node_app
    command:
      - sh
      - -ec
      - |
        yarn install --frozen-lockfile --network-timeout 600000
        exec yarn --cwd excalidraw-app vite --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    environment:
      - CI=true
      - VITE_APP_PORT=3000
      # dev-server only: skip the slow eslint-on-every-file checker
      - VITE_APP_ENABLE_ESLINT=false
      # bind mounts need polling for the watcher to fire
      - CHOKIDAR_USEPOLLING=true
      # the platform sets these; Vite reads the first to extend allowed hosts
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    volumes:
      - ./:/opt/node_app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 240s
    restart: on-failure
