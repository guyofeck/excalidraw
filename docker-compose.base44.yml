services:
  app:
    build:
      context: .
      dockerfile: .base44/Dockerfile.dev
    working_dir: /app
    # Dev server from the cloned source: dependencies are installed from the
    # lockfile on startup (node_modules lives in the bind mount), then Vite runs
    # with HMR so edits show up without rebuilding an image.
    command:
      - sh
      - -ec
      - |
        yarn install --frozen-lockfile --network-timeout 600000
        exec yarn --cwd excalidraw-app vite --host 0.0.0.0
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - CI=true
      - VITE_APP_PORT=3000
      - VITE_APP_ENABLE_ESLINT=false
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    labels:
      base44.project: "Excalidraw"
      base44.kind: "web"
      base44.port: "3000"
