services:
  web:
    image: node:22-bookworm
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BROWSER=none
      - VITE_APP_PORT=3000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./:/app:delegated
      - node_modules_root:/app/node_modules
    command: >
      bash -lc "yarn install --frozen-lockfile --network-timeout 600000 &&
      cd excalidraw-app && npx vite --host 0.0.0.0 --port 3000"

volumes:
  node_modules_root:
