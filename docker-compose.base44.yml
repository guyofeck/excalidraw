services:
  web:
    image: node:24
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        yarn install --frozen-lockfile --network-timeout 600000
        cd excalidraw-app
        exec ../node_modules/.bin/vite --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_APP_PORT=3000
      - BROWSER=none
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./:/app
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: on-failure
